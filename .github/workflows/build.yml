name: Build Fold Blur

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build app
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk FoldBlur.apk

      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: foldblur-${{ github.run_number }}
          name: Fold Blur build ${{ github.run_number }}
          prerelease: true
          files: FoldBlur.apk
